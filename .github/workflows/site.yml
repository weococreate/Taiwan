# 網站 repo（weococreate/Taiwan）的 .github/workflows/site.yml 正本；由 deploy_all.py 的 support_files 放入。
# 2026-10-04 城市散步「展覽活動」雲端自動更新（做法同 Global 的 GlobalRates，AutoDeploy 計劃書 #github-cloud-update）：
#   - 本機 deploy_all 推送到 main → 只發布整站（其他 17 頁照舊由本機更新）
#   - 每天台北 06:00 排程 → 抓文化部藝文活動、合進底稿、重產 CityStroll.html，有變更才以 GITHUB_TOKEN 提交回 main，同一次執行發布
#   - 手動執行 → 可選是否做雲端更新
# 需先把 Pages 發布來源改為「GitHub Actions」；網址由 repo 名稱決定，不變。
# 兩個 repo 變數當開關：PAGES_FROM_ACTIONS=true（切換發布來源時才設；未設前本工作流程完全不動作，舊的「從分支發布」照常）、
# CLOUD_SCHEDULE_ENABLED=true（打開排程）。底稿與模板由本機產生後推上 .cloud/apps/CityStroll/，雲端只讀。
name: site
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'   # 台北 06:00（文化部資料每日更新，起床前就是最新）
  workflow_dispatch:
    inputs:
      update:
        description: '執行城市散步雲端更新（不勾＝只發布整站）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    if: vars.PAGES_FROM_ACTIONS == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.update) || (github.event_name == 'schedule' && vars.CLOUD_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    env:
      SITE_REPO_ROOT: ${{ github.workspace }}
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.14.0'
      - id: update
        run: node .cloud/apps/CityStroll/cloud_update.mjs
      - if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CityStroll.html
          test "$(git diff --cached --name-only)" = "CityStroll.html"
          git commit -m "雲端更新 城市散步 展覽活動"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
  deploy:
    needs: update
    if: >-
      !cancelled() && vars.PAGES_FROM_ACTIONS == 'true' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && !inputs.update) ||
        (needs.update.result == 'success' && needs.update.outputs.changed == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      # 只發布對外網頁：與「從分支發布」時對外可見的檔案相同，不含 .github／.cloud。
      - run: |
          mkdir _site
          rsync -a --exclude=.git --exclude=.github --exclude=.cloud --exclude=.gitignore --exclude=_site ./ _site/
          test -f _site/index.html
          test -z "$(find _site -type f ! -name '*.html')"
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
